<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="compartido.css">
    <link rel="stylesheet" href="documento.css">
    <title>S.I.G.S.M. - Documento</title>
</head>
<body>
    <!-- Barra superior -->
    <header class="barra-superior">
        <div class="logo-header">
            <img src="../../../imagenes/Logo_Hc.jpg" alt="Hospital de Clínicas" class="logo-hc">
            <div class="titulo-header">
                <h1>S.I.G.S.M.</h1>
                <p>Sistema Informático de Gestión de Servicios Médicos</p>
            </div>
        </div>

    </header>
    <!-- Contenido -->
    <main>
    <div class="doc-card">
      <div class="doc-categoria">
        <span class="badge badge-cat">Categoría</span>
      </div>
      <h1 class="doc-titulo">TituloDocumento</h1>
      <p class="doc-descripcion">
        InformacionDocumento
      </p>
      <div class="doc-meta">
        <span>📅 Actualizado: Fecha</span>
        <span>📄 PDF · Peso</span>
      </div>
    </div>
    <div class="acciones-doc">
      <button class="btn-primario">Descargar documento</button>
      <button class="btn-secundario">Ver en pantalla</button>
    </div>
    <div class="visor-pdf">
      <div class="visor-placeholder">
        <span class="visor-icono">📄</span>
        <p>Vista previa del documento</p>
        <small>El PDF se mostrará aquí</small>
      </div>
    </div>
    <a href="../Pacientes/Encuesta.html" class="btn-enviar encuesta-banner">
      <div class="encuesta-banner-texto">
        <strong>¿Fue útil este documento?</strong> 
        <span>Completá una encuesta breve y ayudanos a mejorar</span>
      </div>
    </a>

  </main>

</body>
</html>
