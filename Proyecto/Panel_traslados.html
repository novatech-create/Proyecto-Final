<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>S.I.G.S.M. - Traslados Activos</title>
    <link rel="stylesheet" href="panel_traslados.css">
</head>
<body>
    <header class="barra-superior">
        <h2>S.I.G.S.M.</h2>
        <span>Hospital de Clínicas</span>
    </header>
    <main class="contenedor-panel">
        <h1>Traslados Activos</h1>
        <div class="lista-traslados">
            <div class="tarjeta alta">
                <h3>Ambulancia 01</h3>
                <p>Destino: Piso 2 - Sala 4</p>
                <p><strong>Prioridad:</strong> Emergencia</p>
            </div>
            <div class="tarjeta media">
                <h3>Ambulancia 03</h3>
                <p>Destino: Tomografía</p>
                <p><strong>Prioridad:</strong> Urgencia</p>
            </div>
            <div class="tarjeta baja">
                <h3>Ambulancia 02</h3>
                <p>Destino: Alta médica - Domicilio</p>
                <p><strong>Prioridad:</strong> Común</p>
            </div>
        </div>
    </main>
</body>
</html>
